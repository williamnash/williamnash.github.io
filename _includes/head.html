<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.title == null or page.title == "Home" %}
  <title>{{ site.title }}</title>
  {% else %}
  <title>{{ page.title }} · {{ site.title }}</title>
  {% endif %}
  {% assign desc = page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 %}
  <meta name="description" content="{{ desc }}">
  <meta name="color-scheme" content="light dark">

  <meta property="og:title" content="{% if page.title == null or page.title == "Home" %}{{ site.title }}{% else %}{{ page.title }}{% endif %}">
  <meta property="og:description" content="{{ desc }}">
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/images/og.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="William Nash, Head of Engineering at Chloris Geospatial">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="{{ '/public/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/public/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/public/favicon.ico' | relative_url }}" sizes="any">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/atom.xml' | relative_url }}">
</head>
